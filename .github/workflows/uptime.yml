name: uptime
# external uptime checks every 10 minutes; URLs live in urls.txt
on:
  schedule:
    - cron: '3-59/10 * * * *'  # every 10 min, offset from :00 (GitHub drops more runs at :00)
    - cron: '30 0 1 * *'       # monthly keepalive
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uptime-${{ github.event.schedule == '30 0 1 * *' && 'keepalive' || 'check' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '3-59/10 * * * *'
    steps:
      - uses: actions/checkout@v7
      - name: Restore alert state
        uses: actions/cache/restore@v6
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - name: Check all sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash check.sh
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.schedule == '30 0 1 * *'
    steps:
      - uses: actions/checkout@v7
      - name: Monthly keepalive commit
        run: |
          date -u > .keepalive
          git config user.email "actions@github.com"
          git config user.name "keepalive"
          git add .keepalive && git commit -m "keepalive" && git push || true
