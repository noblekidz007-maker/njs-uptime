name: uptime
# external uptime checks, every hour
on:
  schedule:
    - cron: '0 * * * *'   # hourly uptime check
    - cron: '30 0 1 * *'  # monthly keepalive (offset :30 so it never coincides with a check run)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    steps:
      - name: Check all sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # site root for the marketing site; /healthz for the apps (their roots
          # redirect into Shopify OAuth, which returns 410 to plain probes)
          URLS="https://northjstech.com/ \
                https://upsell.northjstech.com/healthz https://productoptions.northjstech.com/healthz \
                https://cartdrawer.northjstech.com/healthz https://quantitybreaks.northjstech.com/healthz \
                https://richlandingbundle.northjstech.com/healthz \
                https://formbuilder.northjstech.com/healthz https://quiz.northjstech.com/healthz \
                https://deliveryapp.northjstech.com/healthz https://wishlist.northjstech.com/healthz \
                https://sizechart.northjstech.com/healthz \
                https://backinstock.northjstech.com/healthz \
                https://sectionbuilder.northjstech.com/healthz \
                https://fraudfilter.northjstech.com/healthz \
                https://instagramfeed.northjstech.com/healthz \
                https://loyaltyandrewards.northjstech.com/healthz \
                https://emailpopup.northjstech.com/healthz \
                https://currencyconverter.northjstech.com/healthz \
                https://breadcrumbs.northjstech.com/healthz \
                https://combinedlistings.northjstech.com/healthz \
                https://variantimages.northjstech.com/healthz"
          FAILED=""
          for u in $URLS; do
            ok=0
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$u" || echo 000)
              case "$code" in 2*|3*) ok=1; break;; esac
              sleep 10
            done
            [ "$ok" = 1 ] || FAILED="$FAILED ${u#https://}($code)"
          done
          if [ -n "$FAILED" ]; then
            curl -fsS -m 10 \
              -H "Title: SITE DOWN (external check)" \
              -H "Priority: max" \
              -H "Tags: rotating_light" \
              -d "Unreachable from GitHub:$FAILED" \
              "https://ntfy.sh/$NTFY_TOPIC"
            echo "FAILED:$FAILED"; exit 1
          fi
          echo "all sites OK"
  keepalive:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 0 1 * *'
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keepalive commit
        run: |
          date -u > .keepalive
          git config user.email "actions@github.com"
          git config user.name "keepalive"
          git add .keepalive && git commit -m "keepalive" && git push || true
